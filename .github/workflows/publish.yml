name: Publish formula
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-formula
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest stable release
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync.py
      - name: Install and test formula
        if: steps.sync.outputs.changed == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          tap_dir="$(brew --repository)/Library/Taps/uremysunshine/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew install --build-from-source uremysunshine/tap/bump
          brew test uremysunshine/tap/bump
          bump --version
      - name: Publish tested formula
        if: steps.sync.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.sync.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/bump.rb
          git commit -m "chore: update bump to ${VERSION}"
          git push
